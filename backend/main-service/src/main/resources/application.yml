server:
  port: 8081

spring:
  application:
    name: MAIN-SERVICE
  datasource:
    url: jdbc:h2:file:./data/bazaarmaindb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: main-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  # ============================================================================
  # EMAIL NOTIFICATION CONFIG (Gmail SMTP)
  # Replace username & app-password to send real emails on order confirmation.
  # If left as placeholder, email receipts are cleanly logged to console without failing!
  # ============================================================================
  mail:
    host: smtp.gmail.com
    port: 587
    username: "${MAIL_USERNAME:workwithanmol09gmail.com}"
    password: "${MAIL_APP_PASSWORD:Ab12345@}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    expiration-ms: 86400000
  upload:
    dir: "./uploads/items"
  cloudinary:
    cloud-name: "${CLOUDINARY_CLOUD_NAME:xkx66gtv}"
    api-key: "${CLOUDINARY_API_KEY:287175344569776}"
    api-secret: "${CLOUDINARY_API_SECRET:mtkpeDqTVmZP00Sq1YUJgnGRmpY}"
    folder: "bazaarone/items"
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topics:
      order-created: "bazaar.order.created"
      payment-confirmed: "bazaar.payment.confirmed"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

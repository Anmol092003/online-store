server.port=8080
spring.application.name=api-gateway
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins[0]=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins[1]=https://your-domain.com
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[4]=PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[5]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600
spring.cloud.gateway.routes[0].id=store-service
spring.cloud.gateway.routes[0].uri=lb://store-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**, /api/users/**, /api/categories/**, /api/products/**, /api/cart/**, /api/orders/**, /api/addresses/**, /api/reviews/**
spring.cloud.gateway.routes[0].filters[0].name=JwtAuthFilter
spring.cloud.gateway.routes[0].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[1].args.name=store-service-cb
spring.cloud.gateway.routes[0].filters[1].args.fallbackUri=forward:/fallback/store
spring.cloud.gateway.routes[1].id=payment-service
spring.cloud.gateway.routes[1].uri=lb://payment-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.routes[1].filters[0].name=JwtAuthFilter
spring.cloud.gateway.routes[1].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[1].args.name=payment-service-cb
spring.cloud.gateway.routes[1].filters[1].args.fallbackUri=forward:/fallback/payment
spring.cloud.gateway.routes[2].id=notification-service
spring.cloud.gateway.routes[2].uri=lb://notification-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[2].filters[0].name=JwtAuthFilter
spring.cloud.gateway.default-filters[0]=AddRequestHeader=X-Gateway-Source, api-gateway
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
public-endpoints=/api/auth/login,/api/auth/register/**,/api/auth/refresh,/api/auth/google/**,/api/auth/otp/**,/api/products,/api/products/**,/api/categories,/api/categories/**,/actuator/**
management.endpoints.web.exposure.include=*
resilience4j.circuitbreaker.instances.store-service-cb.sliding-window-size=10
resilience4j.circuitbreaker.instances.store-service-cb.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.store-service-cb.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.payment-service-cb.sliding-window-size=10
resilience4j.circuitbreaker.instances.payment-service-cb.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.payment-service-cb.wait-duration-in-open-state=10s

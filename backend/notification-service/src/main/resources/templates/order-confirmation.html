<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #fff; border-radius: 8px; padding: 30px; }
        .header { background: #464feb; color: #fff; padding: 20px; border-radius: 8px 8px 0 0; text-align: center; }
        .content { padding: 20px 0; }
        .order-number { font-size: 24px; color: #464feb; font-weight: bold; }
        .footer { text-align: center; font-size: 12px; color: #999; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Order Confirmed!</h1>
    </div>
    <div class="content">
        <p>Hi <strong th:text="${customerName}">Customer</strong>,</p>
        <p>Your order has been confirmed.</p>
        <p>Order Number: <span class="order-number" th:text="${orderNumber}">ORD-XXXXXX</span></p>
        <p>Total Amount: <strong th:text="${totalAmount}">₹0.00</strong></p>
        <p>We will notify you when your order is shipped.</p>
    </div>
    <div class="footer">
        <p>© 2024 E-Commerce Store. All rights reserved.</p>
    </div>
</div>
</body>
</html>
